    // =========================================================================
    // 2. HÀM TIỆN ÍCH & ĐỘNG CƠ BOM + FEFO (MÔ PHỎNG CHÍNH XÁC PL/pgSQL)
    // =========================================================================
    const vnd = n => new Intl.NumberFormat('vi-VN').format(Math.round(n || 0)) + 'đ';
    const num = n => new Intl.NumberFormat('vi-VN', { maximumFractionDigits: 2 }).format(n || 0);
    function fmtTime(ts = Date.now()) {
      const d = new Date(ts);
      return d.toLocaleTimeString('vi-VN', { hour: '2-digit', minute: '2-digit', second: '2-digit' });
    }
    const getItem = id => state.inventoryItems.find(i => i.id === id);
    const canSeeCost = () => state.currentRole === 'OWNER';

    function getValidStock(itemId) {
      const now = Date.now();
      return state.batches
        .filter(b => b.itemId === itemId && b.remQty > 0 && b.expiresAt > now)
        .reduce((s, b) => s + b.remQty, 0);
    }

    function getExpiredStock(itemId) {
      const now = Date.now();
      return state.batches
        .filter(b => b.itemId === itemId && b.remQty > 0 && b.expiresAt <= now)
        .reduce((s, b) => s + b.remQty, 0);
    }

    // Đúng thứ tự PL/pgSQL: REPLACE -> MULTIPLY -> ADD
    function calculateDynamicBOM(menuItem, modifierIds, qty) {
      const rules = modifierIds.flatMap(mid => (state.modifiers.find(m => m.id === mid)?.rules || []));
      const totals = {};

      // Bước 1 & 2: REPLACE -> MULTIPLY trên từng recipe_line
      menuItem.lines.forEach(line => {
        let effectiveItemId = line.itemId;
        const repRule = rules.find(r => r.action === 'REPLACE' && (r.targetItemId === line.itemId || r.targetRole === line.role));
        if (repRule) effectiveItemId = repRule.replaceWith;

        const mulRules = rules.filter(r => r.action === 'MULTIPLY' && (r.targetItemId === line.itemId || r.targetRole === line.role));
        let factor = 1;
        mulRules.forEach(r => { factor *= r.value; });

        const finalQty = Math.round(line.qty * factor * qty * 1000) / 1000;
        if (finalQty > 0) totals[effectiveItemId] = (totals[effectiveItemId] || 0) + finalQty;
      });

      // Bước 3: ADD
      rules.filter(r => r.action === 'ADD').forEach(r => {
        const addQty = Math.round(r.value * qty * 1000) / 1000;
        if (addQty > 0) totals[r.targetItemId] = (totals[r.targetItemId] || 0) + addQty;
      });

      return Object.entries(totals).map(([itemId, totalQty]) => ({ itemId, totalQty }));
    }

    // Trừ kho FEFO theo từng lô còn hạn sử dụng
    function deductStockFEFO(itemId, qtyNeeded, txnType, refLabel, actorName) {
      const now = Date.now();
      let remaining = qtyNeeded;
      let cogs = 0;
      const item = getItem(itemId);

      const validBatches = state.batches
        .filter(b => b.itemId === itemId && b.remQty > 0 && b.expiresAt > now)
        .sort((a, b) => a.expiresAt - b.expiresAt);

      for (const batch of validBatches) {
        const deduct = Math.min(remaining, batch.remQty);
        batch.remQty = Math.round((batch.remQty - deduct) * 1000) / 1000;
        state.stockLedger.unshift({
          time: fmtTime(),
          itemId,
          batchId: batch.id,
          txnType,
          qtyChange: -deduct,
          unitCost: batch.cost,
          ref: refLabel,
          actor: actorName
        });
        cogs += deduct * batch.cost;
        remaining = Math.round((remaining - deduct) * 1000) / 1000;
        if (remaining <= 0) break;
      }

      let shortfall = 0;
      if (remaining > 0) {
        shortfall = remaining;
        state.stockLedger.unshift({
          time: fmtTime(),
          itemId,
          batchId: 'ÂM KHO (NULL)',
          txnType,
          qtyChange: -remaining,
          unitCost: item.avgCost,
          ref: refLabel,
          actor: actorName
        });
        cogs += remaining * item.avgCost;
      }

      return { cogs: Math.round(cogs * 100) / 100, shortfall };
    }

    function showToast(title, desc, type = 'info') {
      const colors = {
        success: 'bg-emerald-600 text-white',
        warn:    'bg-amber-500 text-slate-950',
        danger:  'bg-rose-600 text-white',
        info:    'bg-slate-800 text-white'
      };
      const el = document.createElement('div');
      el.className = `toast-enter rounded-xl shadow-lg px-4 py-3 ${colors[type] || colors.info}`;
      el.innerHTML = `<div class="font-bold text-sm">${title}</div><div class="text-xs opacity-90 mt-0.5">${desc}</div>`;
      const container = document.getElementById('toast-container');
      container.appendChild(el);
      setTimeout(() => el.remove(), 4800);
    }

        state.currentTab = allowedTabs[0].id;
      }

      nav.innerHTML = NAV_ITEMS.map(item => {
        const allowed = item.roles.includes(role);
        const active = state.currentTab === item.id;
        if (!allowed) {
          return `<div class="px-5 py-2.5 flex items-center justify-between text-slate-600 cursor-not-allowed text-sm" title="Vai trò hiện tại không có quyền truy cập">

            <i data-lucide="lock" class="w-3.5 h-3.5"></i>

        return `<button onclick="switchTab('${item.id}')" class="w-full px-5 py-2.5 flex items-center gap-3 text-sm font-medium transition ${active ? 'tab-active' : 'hover:bg-slate-800 hover:text-white'}">

          <span>${item.label}</span>
        </button>`;

    function confirmAddToCart(menuId) {
      const m = state.menuItems.find(x => x.id === menuId);
      const qty = Math.max(1, parseInt(document.getElementById('mod-qty').value) || 1);
      const modIds = [...document.querySelectorAll('.mod-chk:checked')].map(el => el.value);
      const mods = modIds.map(id => state.modifiers.find(x => x.id === id));
      const unitPrice = m.basePrice + mods.reduce((s, x) => s + x.priceDelta, 0);
      state.cart.push({ menuId, menuName: m.name, qty, modIds, modNames: mods.map(x => x.name), unitPrice });
      closeModal();
      renderAll();
    }

    function removeCartItem(idx) {
      state.cart.splice(idx, 1);
      renderAll();
    }

    function runSeedOrderPreset() {
      state.cart = [{
        menuId: 'MT-CLASSIC',
        menuName: 'Trà Sữa Truyền Thống',
        qty: 2,
        modIds: ['SIZE-L', 'SUGAR-0', 'TOP-PEARL'],
        modNames: ['Size L (700ml)', '0% Đường', 'Thêm Trân châu đen (+50g)'],
        unitPrice: 50000
      }];
      checkoutCart('QR_TRANSFER', 'ORD-TEST-001');
    }

    function checkoutCart(method, customCode = null) {
      if (state.cart.length === 0) return;
      const orderCode = customCode || ('ORD-' + String(state.orders.length + 1).padStart(3, '0'));
      const actor = ROLES[state.currentRole].name;
      let orderTotal = 0;
      let orderCogs = 0;
      const summaryParts = [];
      const touchedItems = new Set();

      state.cart.forEach(line => {
        const menu = state.menuItems.find(m => m.id === line.menuId);
        orderTotal += line.unitPrice * line.qty;
        summaryParts.push(`${line.qty}x ${line.menuName}${line.modNames.length ? ' (' + line.modNames.join(', ') + ')' : ''}`);

        const bomLines = calculateDynamicBOM(menu, line.modIds, line.qty);
        bomLines.forEach(bl => {
          touchedItems.add(bl.itemId);
          const res = deductStockFEFO(bl.itemId, bl.totalQty, 'POS_SALE', orderCode, actor);
          orderCogs += res.cogs;
        });
      });

      state.orders.unshift({
        code: orderCode,
        time: fmtTime(),
        summary: summaryParts.join('; '),
        total: orderTotal,
        cogs: Math.round(orderCogs * 100) / 100,
        method,
        status: 'PAID',
        ticketPrinted: true
      });
      state.cart = [];

      // Cảnh báo chạm ngưỡng Min-stock
      touchedItems.forEach(itemId => {
        const item = getItem(itemId);
        const rem = getValidStock(itemId);
        if (rem <= item.minStock) {
          showToast(`⚠️ Cảnh báo Min-Stock: ${item.name}`, `Tồn còn hạn chỉ còn ${num(rem)} ${item.unit} (ngưỡng tối thiểu ${num(item.minStock)} ${item.unit}).`, 'warn');
        }
      });

      showToast(
        `✅ Đã chốt đơn ${orderCode} (${vnd(orderTotal)})`,
        canSeeCost() ? `Đã trừ kho FEFO tự động. Giá vốn thực xuất: ${vnd(orderCogs)} (${(orderCogs / orderTotal * 100).toFixed(2)}%).` : 'Đã in tem pha chế và trừ kho FEFO tự động.',
        'success'
      );
      renderAll();
    }

    function requestVoidOrder(code) {
      const needPin = state.currentRole === 'CASHIER';
      openModal(`
        <div class="p-5 border-b border-slate-200">
          <h3 class="font-bold text-rose-700 flex items-center gap-2"><i data-lucide="shield-alert" class="w-5 h-5"></i> Hủy hóa đơn đã in tem: ${code}</h3>
          <p class="text-xs text-slate-500 mt-1">${needPin ? 'Thu ngân bị khóa quyền tự hủy. Cần Quản lý nhập mã PIN phê duyệt tại quầy (PIN mẫu: 2468).' : 'Thao tác này sẽ ghi cứng vào Audit Log và gửi cảnh báo về Chủ quán.'}</p>

            <label class="text-xs font-semibold text-slate-600">Lý do hủy bắt buộc *</label>
            <input id="void-reason" type="text" placeholder="VD: Khách đổi ý chọn món khác" class="mt-1 w-full border border-slate-300 rounded-lg px-3 py-2" />
          </div>
          ${needPin ? `
            <div>
              <label class="text-xs font-semibold text-rose-700">Mã PIN Quản lý ca (Manager Override) *</label>
              <input id="void-pin" type="password" placeholder="Nhập 2468 hoặc 9999" class="mt-1 w-full border border-rose-300 rounded-lg px-3 py-2 font-mono tracking-widest" />

          <button onclick="closeModal()" class="px-4 py-2 text-xs font-semibold text-slate-600">Đóng</button>
          <button onclick="confirmVoidOrder('${code}', ${needPin})" class="px-4 py-2 bg-rose-600 text-white text-xs font-bold rounded-lg">Xác nhận Hủy & Ghi Audit Log</button>
        </div>
      `);
    }

    function confirmVoidOrder(code, needPin) {
      const reason = document.getElementById('void-reason').value.trim();
      if (!reason) return showToast('Thiếu lý do', 'Bắt buộc nhập lý do hủy hóa đơn.', 'danger');
      let approver = '—';
      if (needPin) {
        const pin = document.getElementById('void-pin').value.trim();
        if (pin === '2468') approver = ROLES.MANAGER.name;
        else if (pin === '9999') approver = ROLES.OWNER.name;
        else return showToast('Sai mã PIN phê duyệt', 'Mã PIN Quản lý không hợp lệ (thử 2468).', 'danger');
      }
      const o = state.orders.find(x => x.code === code);
      if (o) {
        o.status = 'VOIDED';
        o.voidReason = reason;
        logAudit('POS_VOID_PAID', `Hủy hóa đơn ${code} (${vnd(o.total)}) — Lý do: ${reason}`, approver);
        showToast('🚨 Đã hủy hóa đơn & Bắn cảnh báo Chủ quán', `Bản ghi bất biến đã được lưu vào Audit Log.`, 'warn');
      }
      closeModal();
      renderAll();
    }

        status: 'PENDING', approvedBy: null
      };
      state.wasteRecords.unshift(rec);
      if (state.currentRole !== 'BARISTA') {
        approveWaste(0);
      } else {
        showToast('📩 Đã gửi phiếu báo hủy', 'Barista không có quyền tự duyệt. Hãy đổi sang Quản lý ca để duyệt trừ kho.', 'info');

    function approveWaste(idx) {
      const w = state.wasteRecords[idx];
      if (!w || w.status === 'APPROVED') return;
      w.status = 'APPROVED';
      w.approvedBy = ROLES[state.currentRole].name;

      // Nếu là lý do EXPIRED và có lô quá hạn, trừ thẳng lô quá hạn trước
      let rem = w.qty;
      if (w.reason === 'EXPIRED') {
        const expBatches = state.batches.filter(b => b.itemId === w.itemId && b.remQty > 0 && b.expiresAt <= Date.now());
        for (const b of expBatches) {
          const d = Math.min(rem, b.remQty);
          b.remQty -= d;
          state.stockLedger.unshift({
            time: fmtTime(), itemId: w.itemId, batchId: b.id, txnType: 'WASTE',
            qtyChange: -d, unitCost: b.cost, ref: `Hủy ${w.reason}`, actor: w.approvedBy
          });
          rem -= d;
          if (rem <= 0) break;
        }
      }
      if (rem > 0) deductStockFEFO(w.itemId, rem, 'WASTE', `Hủy ${w.reason}`, w.approvedBy);

      logAudit('WASTE_APPROVED', `Duyệt hủy ${num(w.qty)} ${getItem(w.itemId).unit} ${getItem(w.itemId).name} (${w.reason})`, w.approvedBy);
      showToast('✅ Đã duyệt phiếu hủy & Ghi sổ cái', 'Lượng hủy hợp lệ sẽ được trừ khỏi Tồn lý thuyết EOD.', 'success');
      renderAll();
    }

    // =========================================================================
    // 8. VIEW 5: ĐỐI SOÁT CUỐI NGÀY & KIỂM KHO MÙ (EOD RECONCILIATION)
    // =========================================================================
    function computeEODVariance() {
      const classA = state.inventoryItems.filter(i => i.abc === 'A');
      return classA.map(item => {
        const inp = state.eodDraft.inputs[item.id] || { sealed: 0, grossG: 0 };
        // Tính tồn thực tế từ số hộp nguyên + cân vỏ chai (tare_weight_g)
        const openNet = item.unit === 'pcs'
          ? (parseFloat(inp.grossG) || 0)
          : Math.max(0, (parseFloat(inp.grossG) || 0) - item.tareG);
        const counted = Math.round(((parseFloat(inp.sealed) || 0) * item.packFactor + openNet) * 1000) / 1000;

        // Tổng hợp từ sổ cái stock_ledger (chỉ tính các lô còn hạn làm tồn lý thuyết tại quầy)
        const theoretical = getValidStock(item.id);
        const posUsage = state.stockLedger
          .filter(l => l.itemId === item.id && l.txnType === 'POS_SALE')
          .reduce((s, l) => s + Math.abs(l.qtyChange), 0);
        const wasteQty = state.stockLedger
          .filter(l => l.itemId === item.id && l.txnType === 'WASTE')
          .reduce((s, l) => s + Math.abs(l.qtyChange), 0);

        const variance = Math.round((counted - theoretical) * 1000) / 1000;
        const denom = Math.max(posUsage, 1);
        const pctUsage = posUsage > 0 ? Math.abs(variance) / denom * 100 : (Math.abs(variance) > 0 ? 100 : 0);
        const vndLoss = variance < 0 ? Math.abs(variance) * item.avgCost : 0;

        let alert = 'GREEN';
        if (item.unit === 'pcs' && variance <= -3) alert = 'RED';
        else if (pctUsage > 5) alert = 'RED';
        else if (pctUsage >= 2) alert = 'YELLOW';

        return { item, inp, counted, theoretical, posUsage, wasteQty, variance, pctUsage, vndLoss, alert };
      });
    }

                    <tr>
                      <td class="px-4 py-3">
                        <div class="font-bold text-slate-800">${r.item.name}</div>
                        <div class="text-[11px] text-slate-400">${r.item.packName} = ${num(r.item.packFactor)} ${r.item.unit}${r.item.tareG > 0 ? ` • Vỏ rỗng: ${r.item.tareG}g` : ''}</div>
                      </td>
                      <td class="px-4 py-3">
                        <input type="number" min="0" ${state.eodDraft.submitted ? 'disabled' : ''} value="${r.inp.sealed}"
                          onchange="updateEODInput('${r.item.id}', 'sealed', this.value)"
                          class="w-20 border border-slate-300 rounded-lg px-2.5 py-1.5 text-sm font-semibold" />
                        <span class="text-xs text-slate-400 ml-1">${r.item.packName}</span>
                      </td>
                      <td class="px-4 py-3">
                        <input type="number" min="0" ${state.eodDraft.submitted ? 'disabled' : ''} value="${r.inp.grossG}"
                          onchange="updateEODInput('${r.item.id}', 'grossG', this.value)"
                          class="w-24 border border-slate-300 rounded-lg px-2.5 py-1.5 text-sm font-semibold" />
                        <span class="text-xs text-slate-400 ml-1">${r.item.unit === 'pcs' ? 'ly lẻ' : 'g (tổng)'}</span>
                      </td>
                      <td class="px-4 py-3 text-right font-bold text-slate-900">${num(r.counted)} ${r.item.unit}</td>
                      ${showResults ? `
                        <td class="px-4 py-3 text-right text-slate-600">${num(r.theoretical)} ${r.item.unit}</td>
                        <td class="px-4 py-3 text-right font-bold ${r.variance < 0 ? 'text-rose-600' : r.variance > 0 ? 'text-amber-600' : 'text-emerald-600'}">
                          ${r.variance > 0 ? '+' : ''}${num(r.variance)} ${r.item.unit}
                          ${r.vndLoss > 0 ? `<div class="text-[11px] font-normal">-${vnd(r.vndLoss)}</div>` : ''}
                        </td>
                        <td class="px-4 py-3 text-right font-mono text-xs">${r.posUsage > 0 ? r.pctUsage.toFixed(1) + '%' : (r.variance === 0 ? '0%' : 'Chưa bán')}</td>
                        <td class="px-4 py-3 text-center">
                          <span class="text-[11px] font-bold px-2.5 py-1 rounded-full ${badgeCls}">${r.alert === 'RED' ? 'ĐỎ • BÁO ĐỘNG' : r.alert === 'YELLOW' ? 'VÀNG • THEO DÕI' : 'XANH • AN TOÀN'}</span>
                          ${r.variance > 0 && r.alert !== 'GREEN' ? '<div class="text-[10px] text-amber-700 mt-0.5">Dư bất thường (pha thiếu?)</div>' : ''}
                          ${r.item.unit === 'pcs' && r.variance <= -3 ? '<div class="text-[10px] text-rose-700 font-bold mt-0.5">Nghi vấn bán ngoài POS!</div>' : ''}
                        </td>
                      ` : ''}
                    </tr>
                  `;
                }).join('')}
              </tbody>
            </table>
          </div>
        </div>
      `;
    }

    function updateEODInput(itemId, field, val) {
      if (!state.eodDraft.inputs[itemId]) state.eodDraft.inputs[itemId] = { sealed: 0, grossG: 0 };
      state.eodDraft.inputs[itemId][field] = Math.max(0, parseFloat(val) || 0);
      renderAll();
    }

    function submitEODBlindCount() {
      state.eodDraft.submitted = true;
      state.eodDraft.submittedBy = ROLES[state.currentRole].name;
      state.eodDraft.submittedAt = fmtTime();
      const reds = computeEODVariance().filter(r => r.alert === 'RED');
      logAudit('EOD_BLIND_SUBMIT', `Nộp kiểm kho mù cuối ngày (${reds.length} mục chạm Cờ Đỏ)`);
      if (state.currentRole === 'OWNER') {
        showToast('📊 Đã chạy động cơ đối soát EOD', `Phát hiện ${reds.length} cảnh báo đỏ trên danh mục Nhóm A.`, reds.length ? 'danger' : 'success');
      } else {
        showToast('✅ Đã nộp phiếu kiểm kho mù', 'Kết quả chênh lệch đã được khóa và gửi trực tiếp về Chủ quán. Hãy chuyển sang vai trò Chủ quán để xem!', 'success');
      }
      renderAll();
    }

    function reopenEOD() {
      state.eodDraft.submitted = false;
      renderAll();
    }

    // =========================================================================
    // 9. VIEW 6: NHÂN SỰ, CHỐT KÉT MÙ & AUDIT LOG
    // =========================================================================
    function renderHR() {
      const cashSales = state.orders.filter(o => o.status === 'PAID' && o.method === 'CASH').reduce((s, o) => s + o.total, 0);
      const expectedCash = state.shiftCash.openingCash + cashSales;
      const isOwner = state.currentRole === 'OWNER';

      return `
        <div class="grid grid-cols-1 lg:grid-cols-2 gap-6 mb-6">
          <!-- Chấm công GPS + Wi-Fi -->
          <div class="bg-white rounded-xl border border-slate-200 p-5">
            <div class="flex items-center justify-between mb-3">
              <h2 class="font-bold text-slate-900">Chấm công Ca Chiều (GPS + Wi-Fi BSSID)</h2>
              <button onclick="clockInSelf()" class="px-3 py-1.5 bg-emerald-600 text-white text-xs font-bold rounded-lg">Chấm công ngay</button>
            </div>
            <div class="space-y-2 text-xs">
              ${state.attendance.map(a => `
                <div class="p-2.5 rounded-lg bg-slate-50 border border-slate-200 flex items-center justify-between">
                  <div>
                    <div class="font-bold text-slate-800">${a.name} <span class="font-normal text-slate-500">(${a.role})</span></div>
                    <div class="text-slate-500 mt-0.5">${a.wifi} • GPS: ${a.gps}</div>
                  </div>
                  <div class="text-right">
                    <div class="font-bold text-emerald-700">${a.timeIn}</div>
                    <div class="text-[11px] text-emerald-600">✓ ${a.status}</div>
                  </div>
                </div>
              `).join('')}
            </div>
          </div>

          <!-- Chốt két mù -->
          <div class="bg-white rounded-xl border border-slate-200 p-5">
            <h2 class="font-bold text-slate-900 mb-2">Chốt két tiền cuối ca (Blind Close-out)</h2>
            <p class="text-xs text-slate-500 mb-4">Quỹ đầu ca: <b>${vnd(state.shiftCash.openingCash)}</b>. ${isOwner ? `Tiền mặt kỳ vọng hiện tại (chỉ Chủ thấy): <b class="text-indigo-700">${vnd(expectedCash)}</b>` : 'Hệ thống ẩn tổng tiền mặt bán được cho tới khi chốt sổ.'}</p>
            ${['OWNER', 'MANAGER', 'CASHIER'].includes(state.currentRole) ? `
              <div class="flex gap-2 items-center">
                <input id="blind-cash-input" type="number" placeholder="Nhập tiền mặt đếm thực tế trong két" value="${state.shiftCash.blindCounted ?? ''}" class="flex-1 border border-slate-300 rounded-lg px-3 py-2 text-sm font-bold" />
                <button onclick="submitBlindCash()" class="px-4 py-2 bg-slate-900 text-white text-xs font-bold rounded-lg">Khóa két ca</button>
              </div>
              ${state.shiftCash.closed ? `
                <div class="mt-3 p-3 rounded-lg text-xs ${isOwner ? (state.shiftCash.blindCounted - expectedCash === 0 ? 'bg-emerald-50 text-emerald-800' : 'bg-rose-50 text-rose-800') : 'bg-slate-100 text-slate-700'}">
                  ${isOwner
                    ? `<b>Kết quả đối soát két:</b> Thực đếm ${vnd(state.shiftCash.blindCounted)} vs Kỳ vọng ${vnd(expectedCash)} → Chênh lệch: <b>${vnd(state.shiftCash.blindCounted - expectedCash)}</b>`
                    : `✓ Đã ghi nhận số tiền thực đếm ${vnd(state.shiftCash.blindCounted)}. Kết quả thừa/thiếu đã gửi trực tiếp cho Chủ quán.`}
                </div>
              ` : ''}
            ` : `<div class="text-xs text-slate-400 italic">Vai trò Barista không có quyền truy cập két tiền.</div>`}
          </div>
        </div>

        <!-- Audit Log (Chỉ Owner được xem) -->
        <div class="bg-white rounded-xl border border-slate-200 overflow-hidden">
          <div class="px-5 py-3.5 border-b border-slate-200 font-bold text-slate-900 flex justify-between">
            <span>Nhật ký hệ thống bất biến (audit_logs)</span>
            <span class="text-xs font-normal text-slate-500">${isOwner ? 'Chỉ Chủ quán có quyền xem' : '🔒 Bị khóa theo RBAC'}</span>
          </div>
          ${isOwner ? `
            <table class="w-full text-xs text-left">
              <thead class="uppercase bg-slate-50 text-slate-500">
                <tr><th class="px-4 py-2">Thời gian</th><th class="px-4 py-2">Hành động</th><th class="px-4 py-2">Người thực hiện</th><th class="px-4 py-2">PIN duyệt</th><th class="px-4 py-2">Chi tiết</th></tr>
              </thead>
              <tbody class="divide-y divide-slate-100">
                ${state.auditLogs.map(l => `
                  <tr>
                    <td class="px-4 py-2 text-slate-500">${l.time}</td>
                    <td class="px-4 py-2 font-mono font-bold text-slate-800">${l.action}</td>
                    <td class="px-4 py-2">${l.actor}</td>
                    <td class="px-4 py-2 font-semibold text-indigo-700">${l.approver}</td>
                    <td class="px-4 py-2">${l.detail}</td>
                  </tr>
                `).join('')}
              </tbody>
            </table>
          ` : `<div class="p-8 text-center text-sm text-slate-400">Vai trò <b>${ROLES[state.currentRole].label}</b> không có quyền đọc Nhật ký Audit Log. Hãy chuyển sang <b>Chủ quán</b> để kiểm tra.</div>`}
        </div>
      `;
    }

    function clockInSelf() {
      const r = ROLES[state.currentRole];
      state.attendance.unshift({
        name: r.name, role: state.currentRole, timeIn: fmtTime(),
        wifi: 'BSSID 8C:3B:AD:12:9F', gps: '10.9032, 106.7681', status: 'Hợp lệ (FaceID)'
      });
      showToast('✅ Chấm công thành công', `${r.name} đã xác thực Wi-Fi quán + GPS + ảnh mặt.`, 'success');
      renderAll();
    }

    function submitBlindCash() {
      const val = parseFloat(document.getElementById('blind-cash-input').value);
      if (isNaN(val) || val < 0) return showToast('Số tiền không hợp lệ', 'Vui lòng nhập số tiền mặt thực đếm.', 'danger');
      state.shiftCash.blindCounted = val;
      state.shiftCash.closed = true;
      logAudit('SHIFT_BLIND_CASH_CLOSE', `Chốt két mù cuối ca với số tiền thực đếm ${vnd(val)}`);
      showToast('🔒 Đã khóa sổ két ca', 'Số liệu đã được gửi về báo cáo đối soát của Chủ quán.', 'success');
      renderAll();
    }

    // =========================================================================
    // 10. RENDER TỔNG & KHỞI CHẠY
    // =========================================================================
    function renderAll() {
      renderSidebar();
      const container = document.getElementById('main-content');
      const views = {
        dashboard: renderDashboard,
        pos:       renderPOS,
        inventory: renderInventory,
        bom:       renderBOM,
        eod:       renderEOD,
        hr:        renderHR
      };
      container.innerHTML = (views[state.currentTab] || renderPOS)();
      lucide.createIcons();
    }

    function resetDemoData() {
      const prevRole = state.currentRole || 'OWNER';
      const prevTab = state.currentTab || 'pos';
      state = buildInitialState();
      state.currentRole = prevRole;
      state.currentTab = prevTab;
      initLedgerFromBatches();
      renderAll();
      showToast('🔄 Đã nạp lại Seed Data chuẩn', 'Tất cả lô hàng FEFO, sổ cái và giỏ hàng đã về trạng thái ban đầu.', 'info');
    }

    document.getElementById('role-switcher').addEventListener('change', e => {
      state.currentRole = e.target.value;
      renderAll();
      showToast(`Đang giả lập: ${ROLES[state.currentRole].label}`, ROLES[state.currentRole].hint, 'info');
    });

    // Boot
    state = buildInitialState();
    initLedgerFromBatches();
    renderAll();
  </script>
</body>
</html>

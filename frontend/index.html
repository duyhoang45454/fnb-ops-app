<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>BrewGuard F&amp;B — Quản lý Kho FEFO, BOM Động, RBAC &amp; Đối soát EOD</title>
  <link rel="icon" href="data:," />
  <script src="https://cdn.tailwindcss.com"></script>
  <script src="https://unpkg.com/lucide@latest"></script>
  <style>
    @import url('https://fonts.googleapis.com/css2?family=Be+Vietnam+Pro:wght@400;500;600;700&display=swap');
    body { font-family: 'Be Vietnam Pro', system-ui, -apple-system, sans-serif; }
    .tab-active { background: rgba(245, 158, 11, 0.16); color: #fbbf24; border-right: 3px solid #f59e0b; }
    .custom-scroll::-webkit-scrollbar { width: 6px; height: 6px; }
    .custom-scroll::-webkit-scrollbar-thumb { background: #cbd5e1; border-radius: 9999px; }
    .toast-enter { animation: slideIn 0.25s ease-out; }
    @keyframes slideIn { from { transform: translateX(100%); opacity: 0; } to { transform: translateX(0); opacity: 1; } }
  </style>
</head>
<body class="bg-slate-50 text-slate-800 h-screen flex overflow-hidden">

  <!-- SIDEBAR -->
  <aside class="w-64 bg-slate-900 text-slate-300 flex flex-col shrink-0 select-none">
    <div class="px-5 py-5 border-b border-slate-800 flex items-center gap-3">
      <div class="w-9 h-9 rounded-lg bg-amber-500 text-slate-950 flex items-center justify-center font-bold text-lg shadow">
        <i data-lucide="coffee" class="w-5 h-5"></i>
      </div>
      <div>
        <div class="text-white font-bold tracking-tight leading-tight">BrewGuard F&amp;B</div>
        <div class="text-[11px] text-amber-400 font-medium">FEFO • BOM • RBAC • EOD</div>
      </div>
    </div>

    <nav id="sidebar-nav" class="flex-1 py-4 space-y-1 overflow-y-auto custom-scroll"></nav>

    <div class="p-4 border-t border-slate-800 bg-slate-950/60">
      <div class="flex items-center justify-between gap-2 mb-1.5">
        <div class="text-[11px] uppercase tracking-wider text-slate-400 font-semibold">Giả lập vai trò</div>
        <button id="login-link" type="button" class="text-[11px] font-semibold text-amber-400 hover:text-amber-300 hover:underline flex items-center gap-1 shrink-0" title="Đăng nhập bằng Số điện thoại &amp; Mật khẩu">
          <i data-lucide="log-in" class="w-3 h-3"></i> Đăng nhập SĐT/MK
        </button>
      </div>
      <select id="role-switcher" class="w-full bg-slate-800 border border-slate-700 text-white text-sm rounded-lg px-3 py-2 focus:outline-none focus:border-amber-500">
        <option value="OWNER">👑 Chủ quán (Toàn quyền)</option>
        <option value="MANAGER">🛡️ Quản lý ca (Ẩn giá + PIN)</option>
        <option value="CASHIER">💳 Thu ngân (POS + Két mù)</option>
        <option value="BARISTA">🧋 Barista (SOP + Báo hủy)</option>
      </select>
      <div id="role-hint" class="text-[11px] text-slate-400 mt-2 leading-snug"></div>
    </div>
  </aside>

  <!-- MAIN AREA -->
  <div class="flex-1 flex flex-col min-w-0 overflow-hidden">
    <!-- TOP BAR -->
    <header class="h-16 bg-white border-b border-slate-200 px-6 flex items-center justify-between shrink-0">
      <div class="flex items-center gap-3">
        <h1 id="page-title" class="text-lg font-bold text-slate-900">Tổng quan Vận hành</h1>
        <span id="role-badge" class="text-xs font-semibold px-2.5 py-1 rounded-full bg-amber-100 text-amber-800"></span>
      </div>
      <div class="flex items-center gap-4 text-sm">
        <div id="shift-badge" class="hidden md:flex items-center gap-2 px-3 py-1.5 rounded-lg bg-slate-50 text-slate-500 border border-slate-200">
          <span class="w-2 h-2 rounded-full bg-slate-400"></span>
          <span class="font-medium">Đang tải ca...</span>
        </div>
        <button id="reset-demo-btn" type="button" class="text-xs font-medium px-3 py-1.5 rounded-lg border border-slate-300 hover:bg-slate-100 text-slate-700 flex items-center gap-1.5">
          <i data-lucide="rotate-ccw" class="w-3.5 h-3.5"></i> Nạp lại Seed Data
        </button>
      </div>
    </header>

    <!-- CONTENT CONTAINER -->
    <main id="main-content" class="flex-1 overflow-y-auto p-6 custom-scroll"></main>
  </div>

  <!-- TOAST CONTAINER -->
  <div id="toast-container" class="fixed bottom-5 right-5 z-50 space-y-2 max-w-sm"></div>

  <!-- MODAL CONTAINER -->
  <div id="modal-backdrop" class="fixed inset-0 bg-slate-900/60 backdrop-blur-xs z-40 hidden items-center justify-center p-4">
    <div id="modal-box" class="bg-white rounded-2xl shadow-2xl max-w-lg w-full overflow-hidden"></div>
  </div>

  <script src="app.js"></script>
</body>
</html>
